[package]
name = "model-viewer-thumbnail"
version = "0.2.0"
description = "Explorer thumbnail provider for Model Viewer"
edition = "2021"

# ModelViewerThumbnail.dll, registered by install.ps1.
[lib]
name = "ModelViewerThumbnail"
crate-type = ["cdylib"]

[dependencies]
png = "0.18"
sha2 = "0.11"
# The implement macro expands to windows_core paths, so it must be a direct dependency.
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }
