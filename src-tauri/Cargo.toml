[package]
name = "model-viewer"
version = "0.2.0"
description = "Quick viewer for FBX and OBJ files"
edition = "2021"

[[bin]]
name = "ModelViewer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# custom-protocol: always serve the embedded web files (there is no dev server).
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
arboard = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
