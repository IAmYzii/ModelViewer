<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model Viewer</title>
<style>
  :root {
    --bg-top: #3a3f47; --bg-bottom: #1c1e22;
    --panel: rgba(24, 26, 30, .86); --border: rgba(255, 255, 255, .12);
    --text: #e8eaed; --muted: #9aa0a8; --accent: #4c9dff;
    --top: 88px; /* bottom edge of the toolbar, kept in sync by script */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: linear-gradient(var(--bg-top), var(--bg-bottom));
    color: var(--text); font: 13px/1.4 "Segoe UI", system-ui, sans-serif;
    user-select: none;
  }
  canvas { display: block; width: 100%; height: 100%; outline: none; }
  #tabs {
    position: fixed; top: 0; left: 0; right: 0; height: 36px; display: flex; align-items: flex-end;
    gap: 2px; padding: 0 10px; background: rgba(0, 0, 0, .3); border-bottom: 1px solid var(--border);
    overflow: hidden;
  }
  .tab {
    display: flex; align-items: center; gap: 4px; min-width: 0; max-width: 220px; height: 29px;
    padding: 0 4px 0 12px; border: 1px solid transparent; border-bottom: 0;
    border-radius: 7px 7px 0 0; color: var(--muted); cursor: pointer; white-space: nowrap;
  }
  .tab:hover { background: rgba(255, 255, 255, .06); }
  .tab.on { background: var(--bg-top); border-color: var(--border); color: var(--text); }
  .tab .tname { overflow: hidden; text-overflow: ellipsis; }
  .tab.stale .tname::after { content: ' \2022'; color: var(--accent); }
  #tabs button {
    border: 0; background: none; backdrop-filter: none; color: inherit; padding: 0 6px;
    height: 22px; border-radius: 4px; opacity: .65; font-size: 15px; line-height: 1;
  }
  #tabs button:hover { background: rgba(255, 255, 255, .15); opacity: 1; }
  #tabs .add { align-self: center; color: var(--muted); flex: none; }
  #bar {
    position: fixed; top: 46px; left: 10px; right: 10px; display: flex; gap: 6px; flex-wrap: wrap;
    align-items: center; pointer-events: none;
  }
  #bar > * { pointer-events: auto; }
  button, select {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 9px; font: inherit; cursor: pointer;
  }
  button { backdrop-filter: blur(6px); }
  button:hover, select:hover { border-color: rgba(255, 255, 255, .3); }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  kbd { opacity: .55; font: inherit; margin-left: 6px; }
  select { padding: 6px 6px; }
  select option { background: #24272c; }
  input[type=color] {
    width: 30px; height: 30px; padding: 2px; border: 1px solid var(--border);
    border-radius: 6px; background: var(--panel); cursor: pointer;
  }
  .sep { width: 1px; height: 20px; background: var(--border); margin: 0 2px; }
  .slider {
    display: flex; align-items: center; gap: 6px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; height: 31px;
  }
  .slider input { width: 70px; accent-color: var(--accent); }

  .panel {
    position: fixed; top: var(--top); bottom: 40px; width: 280px;
    display: flex; flex-direction: column; background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px; backdrop-filter: blur(6px);
  }
  .panel[hidden], #viewmenu[hidden] { display: none; }
  .panel .head { display: flex; gap: 4px; align-items: center; padding: 8px; border-bottom: 1px solid var(--border); }
  .panel .head b { flex: 1; }
  .panel button { padding: 3px 8px; }
  .panel .body { flex: 1; overflow-y: auto; padding: 4px 0; }
  .panel .foot { padding: 6px 8px; color: var(--muted); border-top: 1px solid var(--border); font-size: 12px; }
  #parts { right: 10px; }
  #info { left: 10px; user-select: text; }

  .part { display: flex; gap: 6px; align-items: center; padding: 3px 8px; cursor: pointer; }
  .part:hover { background: rgba(255, 255, 255, .07); }
  .part.sel { background: rgba(76, 157, 255, .3); }
  .part.off .pname { color: var(--muted); text-decoration: line-through; }
  .part .pname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .part .ptris { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
  .part .sw { width: 10px; height: 10px; border-radius: 2px; display: none; flex: none; }
  #parts.random .sw { display: block; }

  .irow { display: flex; gap: 8px; padding: 2px 10px; }
  .irow .k { color: var(--muted); flex: none; width: 92px; }
  .irow .v { flex: 1; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  .ihead { padding: 8px 10px 3px; font-weight: 600; border-top: 1px solid var(--border); margin-top: 6px; }
  .ihead:first-child { border-top: 0; margin-top: 0; }
  .ihint { padding: 4px 10px; color: var(--muted); }
  .ibtns { display: flex; gap: 6px; padding: 6px 10px; }

  #viewmenu {
    position: fixed; z-index: 5; width: 250px; padding: 6px 0; background: #1d2024;
    border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
  }
  #viewmenu label, #viewmenu .row { display: flex; align-items: center; gap: 8px; padding: 5px 12px; }
  #viewmenu label { cursor: pointer; }
  #viewmenu label:hover { background: rgba(255, 255, 255, .07); }
  #viewmenu label span, #viewmenu .row span { flex: 1; }
  #viewmenu hr { border: 0; border-top: 1px solid var(--border); margin: 6px 0; }
  #viewmenu button, #viewmenu select { padding: 3px 8px; }
  #viewmenu input { accent-color: var(--accent); }

  #stats {
    position: fixed; left: 12px; bottom: 10px; color: var(--muted);
    font-variant-numeric: tabular-nums; pointer-events: none;
  }
  #help { position: fixed; right: 12px; bottom: 10px; color: var(--muted); pointer-events: none; }
  #version { position: fixed; right: 12px; bottom: 28px; color: var(--muted); font-size: 11px; opacity: .75; pointer-events: none; }
  #empty {
    position: fixed; inset: 0; display: grid; place-items: center; text-align: center;
    pointer-events: none; color: var(--muted);
  }
  #empty b { display: block; font-size: 20px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  #drop {
    position: fixed; inset: 8px; border: 2px dashed var(--accent); border-radius: 12px;
    background: rgba(76, 157, 255, .12); display: none; pointer-events: none;
  }
  body.dragging #drop { display: block; }
  #toast {
    position: fixed; left: 50%; bottom: 44px; transform: translateX(-50%); z-index: 6;
    background: #23262b; border: 1px solid var(--border); border-radius: 6px; padding: 8px 14px;
    max-width: 80vw; display: none; user-select: text;
  }
  #toast.error { background: #7a2b2b; border-color: #b44; }
  #busy { position: fixed; inset: 0; display: none; place-items: center; background: rgba(0, 0, 0, .35); font-size: 16px; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="view" tabindex="0"></canvas>

<div id="version"></div>
<div id="tabs"></div>
<div id="bar">
  <button id="open" title="Open a model (O)">Open…</button>
  <button id="frame" title="Frame the model">Frame<kbd>F</kbd></button>
  <span class="sep"></span>
  <select id="shade" title="Shading (keys 1–7)">
    <option value="textured">Textured</option>
    <option value="simple">Simple</option>
    <option value="random">Random colors</option>
    <option value="checker">UV checker</option>
    <option value="vertex">Vertex colors</option>
    <option value="faces">Face orientation</option>
    <option value="normals">Normals</option>
  </select>
  <select id="vcchan" title="Vertex color channel" hidden>
    <option value="rgb">RGB</option>
    <option value="r">Red</option>
    <option value="g">Green</option>
    <option value="b">Blue</option>
    <option value="a">Alpha</option>
  </select>
  <button id="wire" title="Wireframe overlay">Wireframe<kbd>W</kbd></button>
  <select id="wirecolor" title="Wireframe color">
    <option value="black">Black</option>
    <option value="white">White</option>
    <option value="invert">Inverted</option>
    <option value="custom">Custom…</option>
  </select>
  <input id="wirecustom" type="color" title="Custom wireframe color" hidden>
  <span class="sep"></span>
  <label class="slider" title="Push parts away from the center">Explode
    <input id="explode" type="range" min="0" max="100" value="0"></label>
  <span class="sep"></span>
  <button id="rotx" title="Rotate 90° around X (Shift: other way)">Rot X</button>
  <button id="roty" title="Rotate 90° around Y (Shift: other way)">Rot Y</button>
  <button id="rotz" title="Rotate 90° around Z (Shift: other way)">Rot Z</button>
  <span class="sep"></span>
  <button id="partsbtn" title="Parts list">Parts<kbd>P</kbd></button>
  <button id="infobtn" title="Model information">Info<kbd>I</kbd></button>
  <button id="shot" title="Copy a screenshot to the clipboard (Ctrl+C). Shift+click or Ctrl+S saves a PNG.">Screenshot</button>
  <button id="thumb" title="Use the current view as this file's thumbnail in Explorer">Thumbnail</button>
  <button id="viewbtn" title="View options">View ▾</button>
</div>

<div id="viewmenu" hidden>
  <label><input id="grid" type="checkbox"><span>Floor grid</span><kbd>G</kbd></label>
  <label><input id="cube" type="checkbox"><span>1 m reference cube</span><kbd>M</kbd></label>
  <label><input id="normals" type="checkbox"><span>Vertex normals</span><kbd>N</kbd></label>
  <label id="reloadrow"><input id="autoreload" type="checkbox"><span>Reload when the file changes</span></label>
  <hr>
  <div class="row"><span>One file unit is</span>
    <select id="units">
      <option value="auto">Auto</option>
      <option value="m">1 m</option>
      <option value="cm">1 cm</option>
      <option value="mm">1 mm</option>
      <option value="in">1 inch</option>
    </select>
  </div>
  <hr>
  <div class="row"><span>Rotation for new files: <b id="defrot">as in file</b></span></div>
  <div class="row"><button id="defset">Use current</button><button id="defclear">Clear</button></div>
</div>

<div id="info" class="panel" hidden>
  <div class="head"><b>Info</b></div>
  <div id="infobody" class="body"></div>
</div>

<div id="parts" class="panel" hidden>
  <div class="head">
    <b id="partcount">Parts</b>
    <button id="pall">All</button><button id="pnone">None</button><button id="pinv">Invert</button>
  </div>
  <div id="partlist" class="body"></div>
  <div class="foot">Click: select · Alt+click: show only that part</div>
</div>

<div id="empty"><div><b>Drop an .fbx or .obj file here</b>or click Open. Every model opens in its own tab.</div></div>
<div id="stats"></div>
<div id="help">Left drag: rotate · Right drag: pan · Wheel: zoom · Click: select part</div>
<div id="drop"></div>
<div id="toast"></div>
<div id="busy">Loading…</div>
<input id="file" type="file" multiple hidden
       accept=".fbx,.obj,.mtl,.png,.jpg,.jpeg,.bmp,.gif,.webp,.tga">
<input id="texfile" type="file" hidden accept=".png,.jpg,.jpeg,.bmp,.gif,.webp,.tga">

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';
import { TGALoader } from 'three/addons/loaders/TGALoader.js';
import { upgradeLegacyFbx } from './fbx6.js';

const $ = id => document.getElementById(id);
const canvas = $('view');

// Filled in by scripts/build-web.mjs; the page opened straight from the repo says so.
const VERSION = '__VERSION__';
$('version').textContent = VERSION.startsWith('__') ? 'dev build' : 'v' + VERSION;

// ---------- desktop app bridge ----------
// Inside the desktop app (Tauri) the page can reach the disk and the system;
// opened as a plain web page, `host` is null and those features are hidden.
const tauri = window.__TAURI__ ?? null;
const FS_BASE = 'http://fs.localhost/';   // serves files from disk, see src-tauri/src/main.rs
const encodePath = p => p.replace(/\\/g, '/').split('/').map(encodeURIComponent).join('/');
const host = tauri && {
  invoke: tauri.core.invoke,
  listen: (event, fn) => tauri.event.listen(event, e => fn(e.payload)),
  launchArgs: () => tauri.core.invoke('launch_args'),
  setTitle: title => tauri.core.invoke('set_title', { title }),
  quit: () => tauri.core.invoke('quit'),
  // Watch this list of files (replacing the previous list); "file-changed"
  // fires when one of them has been rewritten.
  watchFiles: paths => tauri.core.invoke('watch_files', { paths }),
  async pickModels() {
    const picked = await tauri.core.invoke('plugin:dialog|open', {
      options: { multiple: true, title: 'Open model', filters: [{ name: '3D models', extensions: ['fbx', 'obj'] }] },
    });
    return picked ? [picked].flat().map(p => (typeof p === 'string' ? p : p.path)) : [];
  },
  async pickSave(defaultPath) {
    const picked = await tauri.core.invoke('plugin:dialog|save', {
      options: { defaultPath, filters: [{ name: 'PNG image', extensions: ['png'] }] },
    });
    return picked ? (typeof picked === 'string' ? picked : picked.path) : null;
  },
  saveFile: (path, bytes) =>
    tauri.core.invoke('save_file', bytes, { headers: { 'x-path': encodeURIComponent(path) } }),
  copyImage: (rgba, width, height) =>
    tauri.core.invoke('copy_image', rgba, { headers: { 'x-width': String(width), 'x-height': String(height) } }),
  // Explorer thumbnails, kept by the app per file content; see save_thumbnail in main.rs.
  hasThumbnail: path => tauri.core.invoke('has_thumbnail', { path }),
  saveThumbnail: (path, png) =>
    tauri.core.invoke('save_thumbnail', png, { headers: { 'x-path': encodeURIComponent(path) } }),
};
const V3 = THREE.Vector3;

// ---------- scene ----------
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 1000);
camera.position.set(3, 2, 3);
scene.add(camera);

// Simple shading: soft sky/ground fill plus a headlight that follows the camera.
scene.add(new THREE.HemisphereLight(0xffffff, 0x555a60, 1.3));
const headlight = new THREE.DirectionalLight(0xffffff, 2.2);
headlight.position.set(0.4, 0.8, 1);
camera.add(headlight);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.12;
controls.zoomToCursor = true;

// Every open model lives in a tab. The variables below always describe the
// active tab; stash() and activate() move them in and out of the tab objects.
const tabs = [];
let active = null;
let tabIds = 0;

let grid = null;
let cube = null;       // the 1 m reference cube
let model = null;      // holder group; carries the orientation fix
let root = null;       // what the loader returned, child of `model`
let parts = [];        // one entry per mesh of the loaded model, see collectParts()
let selected = null;   // the selected part
let current = null;    // where the model came from: { name, files, basePath, diskPath, url }
let explode = 0;       // 0 = assembled
let radius = 1;
const modelBox = new THREE.Box3();   // world bounds of the assembled model

// View settings, remembered between runs. URL parameters override them, which
// the desktop app uses for its command-line switches.
const settings = {
  shade: 'textured', vcChannel: 'rgb', wire: false, wireColor: 'black', wireCustom: '#ff8800',
  grid: true, cube: false, normals: false, parts: false, info: false,
  units: 'auto', defaultRot: null, autoReload: true,
};
try { Object.assign(settings, JSON.parse(localStorage.getItem('settings')) ?? {}); } catch {}
const query = new URLSearchParams(location.search);
if (host) {
  // Command line of the app: model files, and switches such as --shade=checker.
  for (const arg of await host.launchArgs()) {
    const flag = arg.match(/^--([a-z]+)(?:=(.*))?$/);
    if (flag) query.set(flag[1], flag[2] ?? '1');
    else query.append('src', FS_BASE + encodePath(arg));
  }
}
if (query.has('shade')) settings.shade = query.get('shade');
if (query.has('vc')) settings.vcChannel = query.get('vc');
if (query.has('wire')) { settings.wire = true; settings.wireColor = query.get('wire') || settings.wireColor; }
for (const flag of ['parts', 'info', 'cube', 'normals']) if (query.has(flag)) settings[flag] = true;
const SHADES = ['textured', 'simple', 'random', 'checker', 'vertex', 'faces', 'normals'];
if (!SHADES.includes(settings.shade)) settings.shade = 'textured';
if (!['black', 'white', 'invert', 'custom'].includes(settings.wireColor)) settings.wireColor = 'black';
if (!['rgb', 'r', 'g', 'b', 'a'].includes(settings.vcChannel)) settings.vcChannel = 'rgb';
function saveSettings() {
  try { localStorage.setItem('settings', JSON.stringify(settings)); } catch {}
}

// File units. FBX files are almost always in centimetres, OBJ in metres.
const UNITS = { m: [1, 'm'], cm: [0.01, 'cm'], mm: [0.001, 'mm'], in: [0.0254, 'in'] };
if (settings.units !== 'auto' && !UNITS[settings.units]) settings.units = 'auto';
const unitKey = () =>
  settings.units === 'auto' ? (/\.fbx$/i.test(current?.name ?? '') ? 'cm' : 'm') : settings.units;

function resize() {
  const w = innerWidth, h = innerHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();
new ResizeObserver(() => {
  document.documentElement.style.setProperty('--top', $('bar').getBoundingClientRect().bottom + 10 + 'px');
}).observe($('bar'));

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});

// ---------- helpers ----------
const asArray = v => (Array.isArray(v) ? v : [v]);
const fmt = v => Math.round(v).toLocaleString('en-US');
const num = v => String(Number(v.toPrecision(4)));

// Materials of the model itself; the viewer's own overlays are skipped.
function eachMaterial(obj, fn) {
  obj.traverse(o => {
    if (!o.material || o.userData.overlay) return;
    asArray(o.material).forEach(m => fn(m, o));
  });
}

const TEX_SLOTS = ['map', 'normalMap', 'bumpMap', 'specularMap', 'emissiveMap', 'alphaMap',
  'aoMap', 'displacementMap', 'roughnessMap', 'metalnessMap'];

// Textures that failed to load would render black; drop them so the model stays visible.
function dropBrokenTextures(materials) {
  for (const m of materials) {
    for (const k of TEX_SLOTS) {
      if (m[k] && !m[k].image) { m[k] = null; m.needsUpdate = true; }
    }
  }
}

function disposeModel(obj, list = parts) {
  obj.traverse(o => o.geometry?.dispose());
  const disposeMaterial = m => {
    for (const k of TEX_SLOTS) if (m[k] !== checker) m[k]?.dispose();
    m.dispose();
  };
  eachMaterial(obj, disposeMaterial);             // whatever is on the meshes now
  for (const p of list) {
    asArray(p.original).forEach(disposeMaterial); // the file's own materials
    p.override?.dispose();
    p.customMap?.dispose();
  }
}

function setTitle(title) {
  document.title = title;
  host?.setTitle(title);
}

function toast(msg, kind = 'error') {
  const t = $('toast');
  t.textContent = msg;
  t.className = kind;
  t.style.display = 'block';
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => (t.style.display = 'none'), kind === 'error' ? 6000 : 2200);
}

// ---------- bounds, framing, grid, reference cube ----------
// Measure the assembled model (explode temporarily undone).
function measure() {
  applyExplode(0);
  model.updateMatrixWorld(true);
  modelBox.makeEmpty();
  const tmp = new THREE.Box3();
  for (const p of parts) modelBox.union(tmp.copy(geometryBox(p)).applyMatrix4(p.mesh.matrixWorld));
  if (modelBox.isEmpty()) modelBox.setFromObject(model);
  applyExplode(explode);
  model.updateMatrixWorld(true);
}

function geometryBox(p) {
  const g = p.mesh.geometry;
  if (!g.boundingBox) g.computeBoundingBox();
  return g.boundingBox;
}

// What should fit on screen: the model plus the reference cube when shown.
function viewBox() {
  const box = modelBox.clone();
  if (cube) box.expandByObject(cube);
  return box;
}

function frame() {
  if (!model) return;
  const box = viewBox();
  if (box.isEmpty()) return;
  const center = box.getCenter(new V3());
  radius = box.getSize(new V3()).length() / 2 || 1;
  const fitV = radius / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2));
  const dist = Math.max(fitV, fitV / Math.min(camera.aspect, 1)) * 1.05;
  const dir = new V3(1, 0.6, 1).normalize();
  camera.position.copy(center).addScaledVector(dir, dist);
  camera.near = radius / 200;
  camera.far = radius * 400;
  camera.updateProjectionMatrix();
  controls.target.copy(center);
  controls.minDistance = radius / 100;
  controls.maxDistance = radius * 100;
  controls.update();
}

function disposeHelper(obj) {
  scene.remove(obj);
  obj.traverse(o => { o.geometry?.dispose(); o.material?.dispose(); });
}

function buildGrid() {
  if (grid) { disposeHelper(grid); grid = null; }
  if (!model) return;
  const box = viewBox();
  if (box.isEmpty()) return;
  const size = box.getSize(new V3());
  const center = box.getCenter(new V3());
  const span = Math.max(size.x, size.z, size.y * 0.5) || 1;
  const cell = gridCell();
  const cells = Math.max(2, Math.ceil((span * 2) / cell / 2) * 2);
  grid = new THREE.GridHelper(cells * cell, cells, 0x8a9099, 0x5a6068);
  grid.material.transparent = true;
  grid.material.opacity = 0.45;
  // Lines fall on whole multiples of the cell size, where the cube is placed too.
  const snap = v => Math.round(v / cell) * cell;
  grid.position.set(snap(center.x), box.min.y, snap(center.z));
  grid.visible = settings.grid;
  scene.add(grid);
}

// Size of one grid cell in file units: exactly one metre whenever that gives a
// usable grid. Only for very small or very large models does it step down or
// up by factors of ten (10 cm, 1 cm … or 10 m, 100 m …).
function gridCell() {
  const metre = 1 / UNITS[unitKey()][0];
  const size = modelBox.getSize(new V3());
  const span = Math.max(size.x, size.z, size.y * 0.5) || metre;
  let power = Math.min(0, Math.floor(Math.log10(span / (2 * metre))));   // fewer than 2 cells: finer
  power = Math.max(power, Math.ceil(Math.log10((span * 2) / (120 * metre))));   // over 120 cells: coarser
  return metre * Math.pow(10, power);
}

function gridLabel() {
  const metres = gridCell() * UNITS[unitKey()][0];
  if (metres >= 1) return `${num(metres)} m`;
  return metres >= 0.01 ? `${num(metres * 100)} cm` : `${num(metres * 1000)} mm`;
}

// A cube of exactly one metre standing on the floor next to the model.
function buildCube() {
  if (cube) { disposeHelper(cube); cube = null; }
  if (!model || !settings.cube || modelBox.isEmpty()) return;
  const s = 1 / UNITS[unitKey()][0];
  const size = modelBox.getSize(new V3()), center = modelBox.getCenter(new V3());
  const geo = new THREE.BoxGeometry(s, s, s);
  cube = new THREE.Group();
  cube.add(
    new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
      color: 0xffa53d, roughness: 0.6, transparent: true, opacity: 0.35, depthWrite: false,
    })),
    new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: 0xffc27a })),
  );
  // Stand it in a grid cell beside the model, edges on the grid lines.
  const step = Math.max(s, gridCell());
  const gap = Math.max(s, size.x) * 0.1;
  const minX = Math.ceil((modelBox.max.x + gap) / step) * step;
  const minZ = Math.round((center.z - s / 2) / step) * step;
  cube.position.set(minX + s / 2, modelBox.min.y + s / 2, minZ + s / 2);
  cube.updateMatrixWorld(true);
  scene.add(cube);
}

// Call after anything that changes the model's bounds or the helpers around it.
function refreshScene(reframe) {
  measure();
  buildCube();
  buildGrid();
  if (reframe) frame();
  renderInfo();
}

// ---------- orientation ----------
// Turn the model 90° around a world axis; the choice is remembered per file name.
let modelKey = '';
const AXES = { x: new V3(1, 0, 0), y: new V3(0, 1, 0), z: new V3(0, 0, 1) };
function rotate(axis, reverse = false) {
  if (!model) return;
  const q = new THREE.Quaternion().setFromAxisAngle(AXES[axis], (reverse ? -1 : 1) * Math.PI / 2);
  model.quaternion.premultiply(q).normalize();
  try { localStorage.setItem(modelKey, JSON.stringify(model.quaternion.toArray())); } catch {}
  // Keep the current viewing direction and distance, just re-centre on the model.
  const offset = camera.position.clone().sub(controls.target);
  refreshScene(false);
  const center = viewBox().getCenter(new V3());
  controls.target.copy(center);
  camera.position.copy(center).add(offset);
  controls.update();
}

function initialRotation(name) {
  modelKey = 'rot:' + name.toLowerCase();
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(modelKey)); } catch {}
  const q = Array.isArray(saved) && saved.length === 4 ? saved : settings.defaultRot;
  return Array.isArray(q) && q.length === 4 ? q : [0, 0, 0, 1];
}

function describeRotation(q) {
  if (!Array.isArray(q)) return 'as in file';
  const e = new THREE.Euler().setFromQuaternion(new THREE.Quaternion().fromArray(q), 'XYZ');
  const deg = v => Math.round(THREE.MathUtils.radToDeg(v));
  return `X ${deg(e.x)}° · Y ${deg(e.y)}° · Z ${deg(e.z)}°`;
}

// ---------- parts ----------
// Surfaces are pushed back a hair so overlays drawn over them do not flicker.
const SURFACE = { side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 };
const surface = opts => new THREE.MeshStandardMaterial({ roughness: 0.6, metalness: 0, ...SURFACE, ...opts });

// One shared material draws the wireframe of every part on top of its surface.
const wireMaterial = new THREE.MeshBasicMaterial({
  wireframe: true, transparent: true, depthWrite: false, toneMapped: false,
});
const selectMaterial = new THREE.MeshBasicMaterial({
  color: 0x4c9dff, transparent: true, opacity: 0.22, depthWrite: false, toneMapped: false,
  side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1,
});
const normalLineMaterial = new THREE.LineBasicMaterial({ color: 0x35e0c8, toneMapped: false });

// An extra object drawn with a part's mesh (wireframe, selection tint, normals).
function overlay(obj, part, renderOrder) {
  obj.userData.overlay = true;
  obj.raycast = () => {};
  obj.renderOrder = renderOrder;
  part.add(obj);
  return obj;
}

function collectParts(obj) {
  const meshes = [];
  obj.traverse(o => { if (o.isMesh) meshes.push(o); });
  const seen = new Map();
  return meshes.map((mesh, i) => {
    const g = mesh.geometry, pos = g.attributes.position;
    const name = mesh.name || mesh.parent?.name || `Part ${i + 1}`;
    const nth = seen.get(name) ?? 0;
    seen.set(name, nth + 1);
    return {
      mesh, name,
      key: `${name}#${nth}`,     // identifies the part across a reload
      wire: overlay(new THREE.Mesh(g, wireMaterial), mesh, 1),
      normals: null,             // vertex-normal lines, built on demand
      original: mesh.material,   // material(s) from the file
      override: null,            // material of the current shading mode, if not the file's
      customMap: null,           // texture assigned by the user
      color: new THREE.Color().setHSL((i * 0.618034) % 1, 0.65, 0.55),
      verts: pos ? pos.count : 0,
      tris: pos ? (g.index ? g.index.count : pos.count) / 3 : 0,
      basePos: mesh.position.clone(),
      explodeDelta: new V3(),
    };
  });
}

// ---------- explode ----------
// Every part moves away from the model's center along the line through its own
// center. Offsets are worked out in the model's own space, so they survive
// orientation changes, and relative to a parent part, so nested meshes do not
// move twice.
function computeExplode() {
  model.updateMatrixWorld(true);
  const rootInv = root.matrixWorld.clone().invert();
  const m = new THREE.Matrix4(), tmp = new THREE.Box3(), all = new THREE.Box3();
  for (const p of parts) {
    m.multiplyMatrices(rootInv, p.mesh.matrixWorld);
    tmp.copy(geometryBox(p)).applyMatrix4(m);
    p.dir = tmp.getCenter(new V3());
    all.union(tmp);
  }
  const center = all.getCenter(new V3());
  for (const p of parts) p.dir.sub(center);
  const byMesh = new Map(parts.map(p => [p.mesh, p]));
  for (const p of parts) {
    let a = p.mesh.parent;
    while (a && !byMesh.has(a)) a = a.parent;
    const d = p.dir.clone();
    if (a) d.sub(byMesh.get(a).dir);
    m.multiplyMatrices(rootInv, p.mesh.parent.matrixWorld).invert();
    p.explodeDelta = d.applyMatrix3(new THREE.Matrix3().setFromMatrix4(m));
  }
}

function applyExplode(f) {
  for (const p of parts) p.mesh.position.copy(p.basePos).addScaledVector(p.explodeDelta, f);
}

// ---------- shading ----------
let checker = null;
function checkerTexture() {
  if (checker) return checker;
  const N = 8, S = 128, c = document.createElement('canvas');
  c.width = c.height = N * S;
  const ctx = c.getContext('2d');
  ctx.font = `600 ${S * 0.3}px "Segoe UI", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let row = 0; row < N; row++) {
    for (let col = 0; col < N; col++) {
      const light = (row + col) % 2 === 0;
      ctx.fillStyle = `hsl(${col * 45} ${light ? 45 : 35}% ${light ? 72 : 38}%)`;
      ctx.fillRect(col * S, row * S, S, S);
      ctx.fillStyle = light ? 'rgba(0,0,0,.6)' : 'rgba(255,255,255,.75)';
      // A1 is the cell at UV (0,0); letters run along U, numbers along V.
      ctx.fillText('ABCDEFGH'[col] + (N - row), col * S + S / 2, row * S + S / 2);
    }
  }
  checker = new THREE.CanvasTexture(c);
  checker.colorSpace = THREE.SRGBColorSpace;
  checker.wrapS = checker.wrapT = THREE.RepeatWrapping;
  checker.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return checker;
}

// Front faces blue, back faces red: flipped polygons stand out at once.
function facesMaterial(flatShading) {
  const m = surface({ flatShading });
  m.onBeforeCompile = shader => {
    shader.fragmentShader = shader.fragmentShader.replace('#include <color_fragment>',
      '#include <color_fragment>\n' +
      'diffuseColor.rgb = gl_FrontFacing ? vec3(0.28, 0.44, 0.85) : vec3(0.9, 0.1, 0.08);');
  };
  m.customProgramCacheKey = () => 'faces';
  return m;
}

// Vertex colors drawn unlit, either all together or one channel as grey.
function vertexColorMaterial(hasColors) {
  if (!hasColors) return new THREE.MeshBasicMaterial({ color: 0x2c2e32, ...SURFACE });
  const m = new THREE.MeshBasicMaterial({ vertexColors: true, ...SURFACE });
  const channel = settings.vcChannel;
  if (channel !== 'rgb') {
    const value = { r: 'vColor.r', g: 'vColor.g', b: 'vColor.b', a: 'VC_ALPHA' }[channel];
    m.onBeforeCompile = shader => {
      shader.fragmentShader = shader.fragmentShader.replace('#include <color_fragment>',
        '\n#ifdef USE_COLOR_ALPHA\n#define VC_ALPHA vColor.a\n#else\n#define VC_ALPHA 1.0\n#endif\n' +
        `diffuseColor = vec4(vec3(${value}), 1.0);`);
    };
    m.customProgramCacheKey = () => 'vc-' + channel;
  }
  return m;
}

function applyShade() {
  const mode = settings.shade;
  for (const p of parts) {
    p.override?.dispose();
    p.override = null;
    const g = p.mesh.geometry, flatShading = !g.attributes.normal;
    if (mode === 'textured') {
      if (p.customMap) p.override = surface({ map: p.customMap, flatShading });
    } else if (mode === 'simple') p.override = surface({ color: 0xb8bcc2, flatShading });
    else if (mode === 'random') p.override = surface({ color: p.color, flatShading });
    else if (mode === 'checker') {
      // Parts without UVs have nothing to show; mark them plain red.
      p.override = surface(g.attributes.uv ? { map: checkerTexture(), flatShading } : { color: 0xa03030, flatShading });
    } else if (mode === 'vertex') p.override = vertexColorMaterial(!!g.attributes.color);
    else if (mode === 'faces') p.override = facesMaterial(flatShading);
    else if (mode === 'normals') p.override = new THREE.MeshNormalMaterial({ flatShading, ...SURFACE });
    p.mesh.material = p.override ?? p.original;
  }
  $('shade').value = mode;
  $('vcchan').value = settings.vcChannel;
  $('vcchan').hidden = mode !== 'vertex';
  $('parts').classList.toggle('random', mode === 'random');
}

function applyWire() {
  const m = wireMaterial, mode = settings.wireColor;
  if (mode === 'invert') {
    // White lines blended as (1 - what is already drawn): the opposite of the
    // surface colour under every pixel of the line.
    m.color.set(0xffffff);
    m.blending = THREE.CustomBlending;
    m.blendEquation = THREE.AddEquation;
    m.blendSrc = THREE.OneMinusDstColorFactor;
    m.blendDst = THREE.ZeroFactor;
    m.blendSrcAlpha = THREE.OneFactor;
    m.blendDstAlpha = THREE.ZeroFactor;
    // Every edge is shared by two triangles and so gets drawn twice, which would
    // invert it back. Writing depth lets only the first of the two through.
    m.depthWrite = true;
    m.depthFunc = THREE.LessDepth;
  } else {
    m.depthWrite = false;
    m.depthFunc = THREE.LessEqualDepth;
    m.color.set(mode === 'white' ? 0xffffff : mode === 'custom' ? settings.wireCustom : 0x000000);
    m.blending = THREE.NormalBlending;
  }
  m.needsUpdate = true;
  for (const p of parts) p.wire.visible = settings.wire;
  $('wire').classList.toggle('on', settings.wire);
  $('wirecolor').value = mode;
  $('wirecustom').value = settings.wireCustom;
  $('wirecustom').hidden = mode !== 'custom';
}

// A short line along the normal of every vertex.
function buildNormalLines(p) {
  const g = p.mesh.geometry, pos = g.attributes.position, nor = g.attributes.normal;
  if (!pos || !nor) return null;
  const scale = p.mesh.getWorldScale(new V3());
  const length = (modelBox.getSize(new V3()).length() * 0.012) / (Math.max(scale.x, scale.y, scale.z) || 1);
  const data = new Float32Array(pos.count * 6);
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    data.set([x, y, z, x + nor.getX(i) * length, y + nor.getY(i) * length, z + nor.getZ(i) * length], i * 6);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(data, 3));
  return overlay(new THREE.LineSegments(geo, normalLineMaterial), p.mesh, 1);
}

function applyNormals() {
  for (const p of parts) {
    if (settings.normals && !p.normals) p.normals = buildNormalLines(p);
    if (p.normals) p.normals.visible = settings.normals;
  }
  $('normals').checked = settings.normals;
}

// ---------- selection ----------
let selectMesh = null;
function select(p) {
  selectMesh?.removeFromParent();
  selectMesh = null;
  selected = p ?? null;
  if (selected) selectMesh = overlay(new THREE.Mesh(selected.mesh.geometry, selectMaterial), selected.mesh, 2);
  renderParts();
  renderInfo();
  $('partlist').querySelector('.sel')?.scrollIntoView({ block: 'nearest' });
}

const raycaster = new THREE.Raycaster(), pointer = new THREE.Vector2();
function pick(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  pointer.set(((clientX - r.left) / r.width) * 2 - 1, -((clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const meshes = parts.filter(p => p.mesh.visible).map(p => p.mesh);
  const hit = raycaster.intersectObjects(meshes, false)[0];
  return hit ? parts.find(p => p.mesh === hit.object) : null;
}

// ---------- panels ----------
function renderParts() {
  const list = $('partlist');
  list.textContent = '';
  for (const p of parts) {
    const row = document.createElement('div');
    row.className = 'part' + (p.mesh.visible ? '' : ' off') + (p === selected ? ' sel' : '');
    row.title = p.name;
    const box = document.createElement('input');
    box.type = 'checkbox';
    box.checked = p.mesh.visible;
    box.onchange = () => setVisible(q => (q === p ? box.checked : q.mesh.visible));
    row.onclick = e => {
      if (e.target === box) return;
      if (e.altKey) setVisible(q => q === p);
      else select(p === selected ? null : p);
    };
    const swatch = document.createElement('span');
    swatch.className = 'sw';
    swatch.style.background = p.color.getStyle();
    const name = document.createElement('span');
    name.className = 'pname';
    name.textContent = p.name;
    const tris = document.createElement('span');
    tris.className = 'ptris';
    tris.textContent = fmt(p.tris);
    row.append(box, swatch, name, tris);
    list.append(row);
  }
  const shown = parts.filter(p => p.mesh.visible).length;
  $('partcount').textContent = shown === parts.length ? `Parts (${parts.length})` : `Parts (${shown} of ${parts.length})`;
}

function setVisible(test) {
  for (const p of parts) p.mesh.visible = !!test(p);
  renderParts();
  updateStats();
}

function updateStats() {
  const shown = parts.filter(p => p.mesh.visible);
  const sum = key => shown.reduce((n, p) => n + p[key], 0);
  const count = shown.length === parts.length ? fmt(parts.length) : `${fmt(shown.length)} of ${fmt(parts.length)}`;
  $('stats').textContent =
    `${count} parts · ${fmt(sum('tris'))} triangles · ${fmt(sum('verts'))} vertices · grid ${gridLabel()}`;
}

const UV_SETS = ['uv', 'uv1', 'uv2', 'uv3'];
function renderInfo() {
  const body = $('infobody');
  body.textContent = '';
  const el = (cls, text) => {
    const e = document.createElement('div');
    e.className = cls;
    if (text != null) e.textContent = text;
    body.append(e);
    return e;
  };
  const row = (k, v) => {
    const r = el('irow');
    const key = document.createElement('span'); key.className = 'k'; key.textContent = k;
    const val = document.createElement('span'); val.className = 'v'; val.textContent = v;
    r.append(key, val);
  };
  if (!model) { el('ihint', 'No model loaded.'); return; }

  const [metres, unit] = UNITS[unitKey()];
  const dims = box => {
    const s = box.getSize(new V3());
    const inUnits = `${num(s.x)} × ${num(s.y)} × ${num(s.z)} ${unit}`;
    return unit === 'm' ? inUnits : `${inUnits}\n${num(s.x * metres)} × ${num(s.y * metres)} × ${num(s.z * metres)} m`;
  };
  const has = name => parts.filter(p => p.mesh.geometry.attributes[name]).length;
  const of = n => (n === parts.length ? 'all parts' : n === 0 ? 'none' : `${n} of ${parts.length} parts`);
  const materials = new Set(parts.flatMap(p => asArray(p.original)));
  const textures = new Set([...materials].flatMap(m => TEX_SLOTS.map(k => m[k]).filter(Boolean)));

  el('ihead', 'Model');
  row('File', current?.name ?? '');
  row('Size (X×Y×Z)', dims(modelBox));
  row('Units', `1 unit = 1 ${unit}` + (settings.units === 'auto' ? ' (auto)' : ''));
  row('Parts', fmt(parts.length));
  row('Triangles', fmt(parts.reduce((n, p) => n + p.tris, 0)));
  row('Vertices', fmt(parts.reduce((n, p) => n + p.verts, 0)));
  row('Materials', fmt(materials.size));
  row('Textures', fmt(textures.size));
  row('Normals', of(has('normal')));
  row('UVs', of(has('uv')));
  row('Vertex colors', of(has('color')));
  row('Tangents', of(has('tangent')));
  const skinned = parts.filter(p => p.mesh.isSkinnedMesh).length;
  if (skinned) row('Skinned', of(skinned));

  el('ihead', selected ? `Selected: ${selected.name}` : 'Selected part');
  if (!selected) { el('ihint', 'Click a part in the view or in the parts list.'); return; }
  const p = selected, a = p.mesh.geometry.attributes;
  row('Triangles', fmt(p.tris));
  row('Vertices', fmt(p.verts));
  row('Size (X×Y×Z)', dims(geometryBox(p).clone().applyMatrix4(p.mesh.matrixWorld)));
  row('UV sets', UV_SETS.filter(n => a[n]).map((n, i) => `UV${i}`).join(', ') || 'none');
  row('Normals', a.normal ? 'yes' : 'no');
  row('Tangents', a.tangent ? 'yes' : 'no');
  row('Vertex colors', a.color ? (a.color.itemSize === 4 ? 'RGBA' : 'RGB') : 'no');
  if (p.mesh.isSkinnedMesh) row('Skinned', 'yes');
  asArray(p.original).forEach((m, i) => {
    const kind = m.type.replace('Mesh', '').replace('Material', '');
    row(i ? '' : 'Materials', `${m.name || '(unnamed)'} · ${kind}${m.map ? ' · textured' : ''}`);
  });
  row('Texture', p.customMap ? `${p.customMap.name} (assigned here)` : 'from the file');
  const btns = el('ibtns');
  const assign = document.createElement('button');
  assign.textContent = 'Assign texture…';
  assign.onclick = () => $('texfile').click();
  btns.append(assign);
  if (p.customMap) {
    const clear = document.createElement('button');
    clear.textContent = 'Remove';
    clear.onclick = () => { p.customMap.dispose(); p.customMap = null; applyShade(); renderInfo(); };
    btns.append(clear);
  }
  el('ihint', 'You can also drop an image onto a part.');
}

function showPanels() {
  $('parts').hidden = !settings.parts;
  $('partsbtn').classList.toggle('on', settings.parts);
  $('info').hidden = !settings.info;
  $('infobtn').classList.toggle('on', settings.info);
}

// ---------- textures assigned by hand ----------
const isImage = n => /\.(png|jpe?g|bmp|gif|webp|tga)$/i.test(n);
// What an image dropped at `point` (or picked without one) should texture.
function textureTarget(point) {
  return (point && pick(point.x, point.y)) ?? selected ?? (parts.length === 1 ? parts[0] : null);
}

function assignTextureFile(file, p) {
  const url = URL.createObjectURL(file);
  assignTexture(url, file.name, p, () => URL.revokeObjectURL(url));
}

function assignTexture(url, name, p, done = () => {}) {
  const loader = /\.tga$/i.test(name) ? new TGALoader() : new THREE.TextureLoader();
  loader.load(url, tex => {
    done();
    tex.name = name;
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    p.customMap?.dispose();
    p.customMap = tex;
    settings.shade = 'textured';
    applyShade();
    renderInfo();
  }, undefined, () => {
    done();
    toast(`Could not read ${name} as an image.`);
  });
}

// ---------- loading ----------
const isModel = n => /\.(fbx|obj)$/i.test(n);
const baseName = p => decodeURIComponent(p).split(/[\\/]/).pop().toLowerCase();
const fileName = p => p.split(/[\\/]/).pop();
const diskUrl = p => FS_BASE + encodePath(p);
// The disk path behind a URL made by diskUrl(), or null for any other URL.
const diskPathOf = href =>
  host && href.startsWith(FS_BASE) ? decodeURIComponent(href.slice(FS_BASE.length)).replace(/\//g, '\\') : null;

/**
 * @param source  { name, files, basePath, diskPath, url }
 *                files: lower-case file name -> URL for sibling files (textures, mtl)
 *                basePath: URL prefix for resources not found in `files`
 * @param {ArrayBuffer} data  model bytes
 * @param keepTab  set for a reload: the tab whose model is replaced in place,
 *                 keeping its camera, rotation, hidden parts and assigned textures.
 *                 Otherwise the model opens in a new tab.
 * @returns {boolean} false if a reload was put off because its tab is not showing
 */
async function loadModel(source, data, keepTab = null) {
  const keep = !!keepTab;
  const { name, files, basePath } = source;
  const manager = new THREE.LoadingManager();
  manager.addHandler(/\.tga$/i, new TGALoader(manager));
  manager.setURLModifier(url => {
    if (/^(blob|data):/i.test(url)) return url;
    return files.get(baseName(url)) ?? url;
  });
  let pending = false, loaded = null, materials = null, afterTextures = null;
  manager.onStart = () => (pending = true);
  manager.onLoad = () => { pending = false; if (materials) dropBrokenTextures(materials); afterTextures?.(); };

  if (/\.fbx$/i.test(name)) {
    // FBX 6.x binaries (old 3ds Max exports) are rewritten as 7.x text first.
    loaded = new FBXLoader(manager).parse(upgradeLegacyFbx(data), basePath);
  } else {
    const text = new TextDecoder().decode(data);
    const loader = new OBJLoader(manager);
    // Material library: the one the OBJ names (dropped alongside or next to it on
    // disk), else any .mtl that was dropped with it.
    const wanted = text.match(/^mtllib\s+(.+)$/m)?.[1].trim();
    let mtlUrl = wanted && files.get(baseName(wanted));
    if (!mtlUrl && wanted && basePath) mtlUrl = basePath + encodeURIComponent(wanted);
    if (!mtlUrl) mtlUrl = files.get([...files.keys()].find(k => k.endsWith('.mtl')));
    let hasMtl = false;
    if (mtlUrl) {
      const res = await fetch(mtlUrl, { cache: 'no-store' }).catch(() => null);
      if (res?.ok) {
        const lib = new MTLLoader(manager).parse(await res.text(), basePath);
        lib.preload();
        loader.setMaterials(lib);
        hasMtl = true;
      }
    }
    loaded = loader.parse(text);
    if (!hasMtl) {
      const gray = new THREE.MeshStandardMaterial({ color: 0xb8bcc2, roughness: 0.6, metalness: 0 });
      loaded.traverse(o => {
        if (!o.isMesh) return;
        const m = gray.clone();
        m.vertexColors = !!o.geometry.attributes.color;
        m.flatShading = !o.geometry.attributes.normal;
        o.material = m;
      });
    }
  }

  // Viewer-friendly material fixes.
  materials = [];
  eachMaterial(loaded, m => {
    materials.push(m);
    Object.assign(m, SURFACE);
    if (m.transparent && m.opacity === 0) { m.opacity = 1; m.transparent = false; }
  });
  if (!pending) dropBrokenTextures(materials);

  let hasGeometry = false;
  loaded.traverse(o => { if (o.geometry?.attributes?.position?.count) hasGeometry = true; });
  if (!hasGeometry) throw new Error('No geometry found in file.');

  const carry = new Map();   // what a reload hands over to the same part
  let oldRotation = null;
  if (keep) {
    // The user moved to another tab while the file was being read: do it later.
    if (active !== keepTab) { keepTab.stale = true; renderTabs(); return false; }
    for (const p of parts) {
      carry.set(p.key, { visible: p.mesh.visible, customMap: p.customMap });
      p.customMap = null;
    }
    oldRotation = model.quaternion.toArray();
    select(null);
    scene.remove(model);
    disposeModel(model);
  } else {
    // A new file gets a tab of its own; the model shown so far is put aside.
    stash();
    if (model) scene.remove(model);
    selected = null;
    selectMesh = null;
    parts = [];
    active = { id: ++tabIds, modelBox: new THREE.Box3(), blobUrls: source.blobUrls ?? [], stale: false };
    tabs.push(active);
  }
  active.name = name;
  active.path = source.diskPath ?? null;

  current = source;
  // The loaded file sits inside a holder group, so orientation fixes (Rot X/Y/Z)
  // never fight with transforms stored in the file itself.
  root = loaded;
  model = new THREE.Group();
  model.add(root);
  model.quaternion.fromArray(oldRotation ?? initialRotation(name));
  scene.add(model);

  parts = collectParts(root);
  for (const p of parts) {
    const old = carry.get(p.key);
    if (!old) continue;
    p.mesh.visible = old.visible;
    p.customMap = old.customMap;
    carry.delete(p.key);
  }
  for (const old of carry.values()) old.customMap?.dispose();
  computeExplode();
  if (!keep) { explode = 0; $('explode').value = 0; }

  applyShade();
  applyWire();
  refreshScene(!keep);
  applyNormals();
  renderParts();
  updateStats();
  setTitle(`${name} – Model Viewer`);
  $('empty').style.display = 'none';
  renderTabs();
  watchAll();
  // A file opened from disk for the first time gets its Explorer thumbnail,
  // once its textures are in and as long as its tab is still the one showing.
  if (!keep && host && active.path) {
    const tab = active;
    thumbnailJob = host.hasThumbnail(tab.path).then(has => new Promise(done => {
      if (has) return done();
      const make = () => (active === tab && model ? saveThumbnail(true) : Promise.resolve()).then(done);
      if (pending) afterTextures = make; else make();
    })).catch(e => console.error(e));
  }
  return true;
}

// ---------- tabs ----------
// Put the active model's state into its tab object.
function stash() {
  if (!active) return;
  Object.assign(active, { model, root, parts, selected, selectMesh, current, explode, radius, modelKey });
  active.modelBox.copy(modelBox);
  active.view = {
    position: camera.position.clone(), target: controls.target.clone(),
    near: camera.near, far: camera.far, min: controls.minDistance, max: controls.maxDistance,
  };
}

function activate(tab) {
  if (tab === active || !tabs.includes(tab)) return;
  stash();
  if (model) scene.remove(model);
  active = tab;
  ({ model, root, parts, selected, selectMesh, current, explode, radius, modelKey } = tab);
  modelBox.copy(tab.modelBox);
  scene.add(model);
  const v = tab.view;
  camera.position.copy(v.position);
  camera.near = v.near;
  camera.far = v.far;
  camera.updateProjectionMatrix();
  controls.target.copy(v.target);
  controls.minDistance = v.min;
  controls.maxDistance = v.max;
  controls.update();
  $('explode').value = (explode / 1.5) * 100;
  showActive();
  if (tab.stale) reload();   // its file changed while another tab was showing
}

// Bring everything on screen in line with the active tab (or with no tab at all).
function showActive() {
  applyShade();   // the shading or wireframe may have been changed in another tab
  applyWire();
  if (model) refreshScene(false);
  else { buildCube(); buildGrid(); renderInfo(); }
  applyNormals();
  renderParts();
  if (model) updateStats();
  else $('stats').textContent = '';
  setTitle(model ? `${current.name} – Model Viewer` : 'Model Viewer');
  $('empty').style.display = model ? 'none' : '';
  renderTabs();
}

function closeTab(tab) {
  const i = tabs.indexOf(tab);
  if (i < 0) return;
  const wasActive = tab === active;
  if (wasActive) { stash(); scene.remove(tab.model); }
  disposeModel(tab.model, tab.parts);
  tab.blobUrls.forEach(u => URL.revokeObjectURL(u));
  tabs.splice(i, 1);
  if (wasActive) {
    active = null;
    model = root = current = selected = selectMesh = null;
    parts = [];
    explode = 0;
    $('explode').value = 0;
    const next = tabs[Math.min(i, tabs.length - 1)];
    if (next) activate(next);
    else showActive();
  } else renderTabs();
  watchAll();
}

function cycleTab(step) {
  if (tabs.length < 2) return;
  activate(tabs[(tabs.indexOf(active) + step + tabs.length) % tabs.length]);
}

const samePath = (a, b) => !!a && !!b && a.toLowerCase() === b.toLowerCase();
const findTab = path => tabs.find(t => samePath(t.path, path));

function renderTabs() {
  const bar = $('tabs');
  bar.textContent = '';
  for (const tab of tabs) {
    const el = document.createElement('div');
    el.className = 'tab' + (tab === active ? ' on' : '') + (tab.stale ? ' stale' : '');
    el.title = tab.path ?? tab.name;
    const name = document.createElement('span');
    name.className = 'tname';
    name.textContent = tab.name;
    const close = document.createElement('button');
    close.textContent = '×';
    close.title = 'Close (Ctrl+W)';
    close.onclick = e => { e.stopPropagation(); closeTab(tab); };
    el.onclick = () => activate(tab);
    el.onauxclick = e => { if (e.button === 1) closeTab(tab); };
    el.append(name, close);
    bar.append(el);
  }
  const add = document.createElement('button');
  add.className = 'add';
  add.textContent = '+';
  add.title = 'Open a model in a new tab (O)';
  add.onclick = () => $('open').click();
  bar.append(add);
  bar.querySelector('.on')?.scrollIntoView({ inline: 'nearest' });
}

async function openFiles(fileList, dropPoint = null) {
  const list = [...fileList];
  const main = list.find(f => isModel(f.name));
  if (!main) {
    // An image on its own is a texture for the part it was dropped on.
    const image = list.find(f => isImage(f.name));
    if (!image || !model) { toast('No .fbx or .obj file in the selection.'); return; }
    const target = textureTarget(dropPoint);
    if (target) assignTextureFile(image, target);
    else toast('Drop the image onto the part it belongs to.');
    return;
  }
  $('busy').style.display = 'grid';
  await new Promise(r => setTimeout(r, 30)); // let the overlay paint before the blocking parse
  const blobUrls = [];
  const files = new Map();
  for (const f of list) {
    if (f === main) continue;
    const url = URL.createObjectURL(f);
    blobUrls.push(url);
    files.set(f.name.toLowerCase(), url);
  }
  // A file handed over by the browser has no known location: no neighbouring
  // textures and no reload. (The desktop app opens paths instead, see openPaths.)
  const source = { name: main.name, files, basePath: '', diskPath: null, url: null, blobUrls };
  try {
    await loadModel(source, await main.arrayBuffer());
  } catch (e) {
    console.error(e);
    blobUrls.forEach(u => URL.revokeObjectURL(u));
    toast(`Could not load ${main.name}: ${e.message}`);
  } finally {
    $('busy').style.display = 'none';
  }
}

// Desktop app: files by path, from the Open dialog, a drop or "Open with".
async function openPaths(paths, dropPoint = null) {
  const models = paths.filter(isModel);
  if (models.length) {
    for (const p of models) await openUrl(diskUrl(p));
    return;
  }
  const image = paths.find(isImage);
  if (!image || !model) { if (paths.length) toast('No .fbx or .obj file in the selection.'); return; }
  const target = textureTarget(dropPoint);
  if (target) assignTexture(diskUrl(image), fileName(image), target);
  else toast('Drop the image onto the part it belongs to.');
}

async function openUrl(url) {
  const abs = new URL(url, location.href);
  const path = decodeURIComponent(abs.pathname);
  const diskPath = diskPathOf(abs.href);
  const open = findTab(diskPath);
  if (open) { activate(open); reload(); return; }   // already in a tab: show it, refreshed
  $('busy').style.display = 'grid';
  try {
    const res = await fetch(abs, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const source = {
      name: path.split('/').pop(),
      files: new Map(),
      basePath: abs.href.slice(0, abs.href.lastIndexOf('/') + 1),
      diskPath,
      url: abs.href,
    };
    await loadModel(source, await res.arrayBuffer());
  } catch (e) {
    console.error(e);
    toast(`Could not load ${url}: ${e.message}`);
  } finally {
    $('busy').style.display = 'none';
  }
}

// Load the current file again, keeping the view. Used when it changes on disk.
let reloading = false;
async function reload() {
  const tab = active, source = current;
  if (!tab || !source?.url) return;
  if (reloading) { tab.stale = true; return; }
  reloading = true;
  tab.stale = false;
  try {
    const res = await fetch(source.url, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    if (await loadModel(source, await res.arrayBuffer(), tab)) toast(`Reloaded ${source.name}`, 'info');
  } catch (e) {
    console.error(e);
    toast(`Could not reload ${source.name}: ${e.message}`);
  } finally {
    reloading = false;
    renderTabs();
    if (active?.stale) reload();   // something changed again in the meantime
  }
}

// Ask the desktop app to watch the files of all tabs.
function watchAll() {
  host?.watchFiles(settings.autoReload ? tabs.map(t => t.path).filter(Boolean) : []);
}
host?.listen('file-changed', path => {
  const tab = findTab(path);
  if (!tab) return;
  if (tab === active) reload();
  else { tab.stale = true; renderTabs(); }   // reloaded when its tab is shown
});
// A file opened from Explorer while the app is already running.
host?.listen('open-files', paths => openPaths(paths));

// The desktop app reports file drops itself (with full paths) instead of the
// browser's drag events.
if (host) {
  const dragging = on => document.body.classList.toggle('dragging', on);
  host.listen('tauri://drag-enter', () => dragging(true));
  host.listen('tauri://drag-leave', () => dragging(false));
  host.listen('tauri://drag-drop', ({ paths, position }) => {
    dragging(false);
    openPaths(paths, { x: position.x / devicePixelRatio, y: position.y / devicePixelRatio });
  });
}

// ---------- screenshot ----------
// The view as it is right now. The drawing buffer is only valid until the next
// frame, so everything is read out before returning.
function capture() {
  renderer.render(scene, camera);
  const url = canvas.toDataURL('image/png');   // background stays transparent
  const flat = document.createElement('canvas');
  flat.width = canvas.width;
  flat.height = canvas.height;
  const ctx = flat.getContext('2d');
  ctx.drawImage(canvas, 0, 0);
  const pixels = ctx.getImageData(0, 0, flat.width, flat.height).data;
  return {
    url, width: flat.width, height: flat.height,
    rgba: new Uint8Array(pixels.buffer),
    png: () => Uint8Array.from(atob(url.slice(url.indexOf(',') + 1)), c => c.charCodeAt(0)),
  };
}

async function screenshot(save) {
  if (!model) return;
  const shot = capture();
  const name = (current?.name ?? 'model').replace(/\.[^.]+$/, '') + '.png';
  try {
    if (save && host) {
      const path = await host.pickSave(name);
      if (!path) return;
      await host.saveFile(path, shot.png());
      toast(`Saved ${fileName(path)}`, 'info');
    } else if (save) {
      const a = document.createElement('a');
      a.href = shot.url;
      a.download = name;
      a.click();
    } else {
      if (host) await host.copyImage(shot.rgba, shot.width, shot.height);
      else {
        const blob = await (await fetch(shot.url)).blob();
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
      }
      toast('Screenshot copied to the clipboard', 'info');
    }
  } catch (e) {
    console.error(e);
    toast(`Could not ${save ? 'save' : 'copy'} the screenshot: ${e?.message ?? e}`);
  }
}

// ---------- thumbnail ----------
// The view cropped to the model and shrunk to THUMB px on the longer side, as
// PNG bytes with a transparent background. The floor grid and the reference
// cube stay out of it.
const THUMB = 512;
let thumbnailJob = Promise.resolve();   // the automatic save of the file opened last
function renderThumbnail() {
  const shown = [grid?.visible, cube?.visible];
  if (grid) grid.visible = false;
  if (cube) cube.visible = false;
  renderer.render(scene, camera);
  let x0 = canvas.width, y0 = canvas.height, x1 = 0, y1 = 0;
  const corner = new V3();
  for (let i = 0; i < 8 && !modelBox.isEmpty(); i++) {
    corner.set(i & 1 ? modelBox.max.x : modelBox.min.x, i & 2 ? modelBox.max.y : modelBox.min.y,
      i & 4 ? modelBox.max.z : modelBox.min.z).project(camera);
    const px = (corner.x + 1) / 2 * canvas.width, py = (1 - corner.y) / 2 * canvas.height;
    x0 = Math.min(x0, px); y0 = Math.min(y0, py); x1 = Math.max(x1, px); y1 = Math.max(y1, py);
  }
  const pad = Math.max(x1 - x0, y1 - y0) * 0.06;
  x0 = Math.max(0, Math.floor(x0 - pad)); y0 = Math.max(0, Math.floor(y0 - pad));
  x1 = Math.min(canvas.width, Math.ceil(x1 + pad)); y1 = Math.min(canvas.height, Math.ceil(y1 + pad));
  if (!(x1 > x0 && y1 > y0)) { x0 = 0; y0 = 0; x1 = canvas.width; y1 = canvas.height; }
  const scale = Math.min(1, THUMB / Math.max(x1 - x0, y1 - y0));
  const out = document.createElement('canvas');
  out.width = Math.max(1, Math.round((x1 - x0) * scale));
  out.height = Math.max(1, Math.round((y1 - y0) * scale));
  out.getContext('2d').drawImage(canvas, x0, y0, x1 - x0, y1 - y0, 0, 0, out.width, out.height);
  if (grid) grid.visible = shown[0];
  if (cube) cube.visible = shown[1];
  const url = out.toDataURL('image/png');
  return Uint8Array.from(atob(url.slice(url.indexOf(',') + 1)), c => c.charCodeAt(0));
}

// Save the current view as the open file's Explorer thumbnail. `quiet` is the
// automatic one on first open: no messages.
async function saveThumbnail(quiet) {
  if (!host || !model || !active?.path) {
    if (!quiet) toast('Thumbnails need a model opened from disk.');
    return;
  }
  try {
    await host.saveThumbnail(active.path, renderThumbnail());
    if (!quiet) toast('Thumbnail saved for Explorer', 'info');
  } catch (e) {
    console.error(e);
    if (!quiet) toast(`Could not save the thumbnail: ${e?.message ?? e}`);
  }
}

// ---------- UI ----------
const setShade = mode => { settings.shade = mode; applyShade(); saveSettings(); };
const toggle = (key, apply) => () => { settings[key] = !settings[key]; apply(); saveSettings(); };

$('open').onclick = () => (host ? host.pickModels().then(paths => openPaths(paths)) : $('file').click());
$('file').onchange = e => { openFiles(e.target.files); e.target.value = ''; };
$('texfile').onchange = e => {
  if (e.target.files[0] && selected) assignTextureFile(e.target.files[0], selected);
  e.target.value = '';
};
$('frame').onclick = frame;
$('shade').onchange = e => { setShade(e.target.value); e.target.blur(); };
$('vcchan').onchange = e => { settings.vcChannel = e.target.value; applyShade(); saveSettings(); e.target.blur(); };
$('wire').onclick = toggle('wire', applyWire);
$('wirecolor').onchange = e => {
  settings.wireColor = e.target.value;
  settings.wire = true;   // picking a colour is a request to see it
  applyWire();
  saveSettings();
  e.target.blur();
};
$('wirecustom').oninput = e => { settings.wireCustom = e.target.value; applyWire(); saveSettings(); };
$('explode').oninput = e => { explode = (e.target.value / 100) * 1.5; applyExplode(explode); };
for (const axis of ['x', 'y', 'z']) $('rot' + axis).onclick = e => rotate(axis, e.shiftKey);
$('partsbtn').onclick = toggle('parts', showPanels);
$('infobtn').onclick = toggle('info', showPanels);
$('pall').onclick = () => setVisible(() => true);
$('pnone').onclick = () => setVisible(() => false);
$('pinv').onclick = () => setVisible(p => !p.mesh.visible);
$('shot').onclick = e => screenshot(e.shiftKey);
$('thumb').onclick = () => saveThumbnail(false);

// View menu
const applyGrid = () => { if (grid) grid.visible = settings.grid; $('grid').checked = settings.grid; };
const applyCube = () => {
  $('cube').checked = settings.cube;
  if (!model) return;
  buildCube();
  buildGrid();
  frame();
};
const applyDefaultRot = () => { $('defrot').textContent = describeRotation(settings.defaultRot); };
$('grid').onchange = toggle('grid', applyGrid);
$('cube').onchange = toggle('cube', applyCube);
$('normals').onchange = toggle('normals', applyNormals);
$('autoreload').onchange = toggle('autoReload', watchAll);
$('units').onchange = e => {
  settings.units = e.target.value;
  saveSettings();
  if (!model) return;
  buildCube();
  buildGrid();
  if (cube) frame();
  renderInfo();
  updateStats();
};
$('defset').onclick = () => {
  if (!model) return;
  settings.defaultRot = model.quaternion.toArray();
  saveSettings();
  applyDefaultRot();
};
$('defclear').onclick = () => { settings.defaultRot = null; saveSettings(); applyDefaultRot(); };
$('viewbtn').onclick = () => {
  const menu = $('viewmenu');
  menu.hidden = !menu.hidden;
  const r = $('viewbtn').getBoundingClientRect();
  menu.style.top = r.bottom + 6 + 'px';
  menu.style.left = Math.max(10, Math.min(r.left, innerWidth - 260)) + 'px';
};
addEventListener('pointerdown', e => {
  if (!$('viewmenu').contains(e.target) && e.target !== $('viewbtn')) $('viewmenu').hidden = true;
});

// A click that is not a drag selects the part under the cursor.
let downAt = null;
canvas.addEventListener('pointerdown', e => { downAt = e.button === 0 ? { x: e.clientX, y: e.clientY } : null; });
canvas.addEventListener('pointerup', e => {
  if (!downAt || !model) return;
  const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y);
  downAt = null;
  if (moved < 5) select(pick(e.clientX, e.clientY));
});

$('grid').checked = settings.grid;
$('cube').checked = settings.cube;
$('autoreload').checked = settings.autoReload;
$('units').value = settings.units;
$('reloadrow').hidden = !host;   // needs the desktop app to watch files
$('thumb').hidden = !host;       // thumbnails live in the app's cache
applyDefaultRot();
showPanels();
applyShade();
applyWire();
applyNormals();
renderInfo();
renderTabs();

addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = e.key.toLowerCase();
  if (e.ctrlKey || e.metaKey) {
    if (k === 'c' && !getSelection().toString()) { e.preventDefault(); screenshot(false); }
    else if (k === 's') { e.preventDefault(); screenshot(true); }
    else if (k === 'w') { e.preventDefault(); if (active) closeTab(active); }
    else if (k === 'tab') { e.preventDefault(); cycleTab(e.shiftKey ? -1 : 1); }
    return;
  }
  if (e.altKey) return;
  if (SHADES[k - 1]) return setShade(SHADES[k - 1]);
  if (k === 'f5') { e.preventDefault(); reload(); }
  else if (k === 'escape') { $('viewmenu').hidden = true; select(null); }
  else if (k === 'f') frame();
  else if (k === 'w') $('wire').click();
  else if (k === 'g') $('grid').click();
  else if (k === 'm') $('cube').click();
  else if (k === 'n') $('normals').click();
  else if (k === 'p') $('partsbtn').click();
  else if (k === 'i') $('infobtn').click();
  else if (k === 'o') $('open').click();
  else if (k === 'x' || k === 'y' || k === 'z') rotate(k, e.shiftKey);
});

let dragDepth = 0;
addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => {
  e.preventDefault();
  dragDepth = 0;
  document.body.classList.remove('dragging');
  if (e.dataTransfer.files.length) openFiles(e.dataTransfer.files, { x: e.clientX, y: e.clientY });
});

// Handle for debugging from the browser console.
window.viewer = {
  THREE, renderer, scene, camera, controls, frame, rotate, select, pick, reload, settings,
  tabs, activate, closeTab, openUrl,
  get active() { return active; },
  get model() { return model; }, get parts() { return parts; }, get selected() { return selected; },
};

// viewer.html?src=path/or/url/to/model.fbx  (repeatable; &explode=0..1 &select=partIndex)
const sources = query.getAll('src');
if (sources.length) {
  (async () => { for (const s of sources) await openUrl(s); })().then(() => {
    if (query.has('explode')) {
      $('explode').value = query.get('explode') * 100;
      $('explode').oninput({ target: $('explode') });
    }
    if (query.has('select')) select(parts[+query.get('select')]);
    if (query.has('copy')) screenshot(false);
    // --screenshot=out.png: save the view as a PNG and exit.
    if (host && query.get('screenshot')) {
      setTimeout(async () => {
        try { await host.saveFile(query.get('screenshot'), capture().png()); } catch (e) { console.error(e); }
        await thumbnailJob;   // the first-open thumbnail may still be on its way
        host.quit();
      }, 1500);
    }
  });
}
</script>
